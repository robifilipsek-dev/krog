/* ===== Krog polish layer ===== */
:root{--r:20px;--sh:0 1px 2px #0f1c3a0d,0 8px 24px -12px #0f1c3a24;--ring:color-mix(in srgb,var(--ac) 35%,transparent)}
[data-t=dark]{--sh:0 1px 2px #0006,0 10px 28px -14px #000a}
body{-webkit-font-smoothing:antialiased}
header{position:relative;z-index:3;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);font-size:25px;letter-spacing:-.04em}
.card{border-radius:var(--r);box-shadow:var(--sh);transition:box-shadow .2s}
.page-heading h2{font-size:30px;letter-spacing:-.04em;line-height:1.1}
.cta{border-radius:16px;box-shadow:0 8px 18px -8px var(--ac);letter-spacing:.01em}
.cta.soc,.cta.google-signin{box-shadow:none}

.chip,.act button{border:1px solid transparent;min-height:36px;font-weight:500}
.act button.on,.chip.on{box-shadow:0 0 0 2px var(--ring)}
nav{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px)}
nav button.on b{background:color-mix(in srgb,var(--ac) 18%,transparent)}
.fab{width:auto;height:52px;padding:0 20px 0 16px;border-radius:26px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;box-shadow:0 10px 24px -8px #0006}
.fab span{font-size:24px;line-height:1}
.bar{border:1px solid var(--bd);min-height:44px}.bar p{gap:12px;align-items:center}.bar u{transition:width .4s ease;border-radius:0 12px 12px 0}.bar.mine{border-color:var(--ac);font-weight:600}.bar:disabled{opacity:1;cursor:default}
.cm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;background:var(--in);border-radius:12px}

async function shrink(file,max=900){
 if(!file||file.size>25*1024*1024)throw Error('KROG:big');
 return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),im=new Image();const done=()=>URL.revokeObjectURL(url);
 im.onload=()=>{try{const scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.6))}catch(e){reject(e)}finally{done()}};
 im.onerror=()=>{done();reject(Error('KROG:imageerror'))};im.src=url});
}

function finishUI(){ $('#app').innerHTML='<div class="auth"><h1>Krog</h1><p>'+t('bootHint')+'</p>'+field('an','name','text',authUser.displayName||'','maxlength="50"')+field('ac','code')+btn('finish',t('go'),'','cta')+btn('logout',t('out'))+'</div>' }
function randomCode(){const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,n=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n%32]).join('')}
function memberData(u){return{name:String(u.name||'?').slice(0,50),color:COLORS.includes(u.color)?u.color:COLORS[0],bio:u.bio||'',birthday:u.birthday||'',avatar:u.avatar||'',ts:ts()}}
async function createProfile(name){
 checkOnline();name=name.trim();if(!name||name.length>50)throw Error('KROG:invalid');
 const ref=db.doc('users/'+auth.currentUser.uid);
 await db.runTransaction(async tx=>{const s=await tx.get(ref);if(s.exists)return;tx.set(ref,{name,color:COLORS[Math.floor(Math.random()*COLORS.length)],gids:[],ts:ts()})});
}
async function createGroup(name){
 checkOnline();name=name.trim();if(!name||name.length>60)throw Error('KROG:invalid');
 const uid=auth.currentUser.uid,g=raw.collection('groups').doc().id,code=randomCode(),b=db.batch();
 b.set(db.doc('groups/'+g),{name,adminUid:uid,activeIds:[uid],ts:ts()});
 b.set(db.doc('groups/'+g+'/private/app'),{code});
 b.set(db.doc('invites/'+code),{gid:g,name,enabled:true});
 b.set(db.doc('groups/'+g+'/members/'+uid),memberData(me||{}));
 b.update(db.doc('users/'+uid),{gids:F.arrayUnion(g)});
 await b.commit();return g;
}
async function joinWithCode(code){
 checkOnline();code=code.trim().toUpperCase();if(!code)throw Error('KROG:codeNeeded');
 const uid=auth.currentUser.uid;let inv;
 try{inv=await db.doc('invites/'+code).get()}catch(e){throw Error('KROG:codeInvalid')}
 if(!inv.exists||typeof inv.data().gid!=='string')throw Error('KROG:codeInvalid');
 const g=inv.data().gid;if((me?.gids||[]).includes(g))return g;
 const u=(await db.doc('users/'+uid).get()).data()||{},b=db.batch();
 b.set(db.doc('groups/'+g+'/enrollment/'+uid),{code});
 b.update(db.doc('groups/'+g),{activeIds:F.arrayUnion(uid)});
 b.set(db.doc('groups/'+g+'/members/'+uid),memberData(u));
 b.update(db.doc('users/'+uid),{gids:F.arrayUnion(g)});
 try{await b.commit()}catch(e){if(e.code==='permission-denied')throw Error('KROG:joinFailed');throw e}
 return g;
}
// Runs a join/create action without the profile listener reopening groups half-way, then opens the result.
async function runJoining(fn){
 joining=true;let g=null,err=null;
 try{g=await fn()}catch(e){err=e}
 joining=false;
 try{if(g)await setGroup(g);else if(me)await route(session);else if(authUser)finishUI()}catch(e){err=err||e}
 if(err)throw err;
}
async function setGroup(g){
 store.set('g:'+me.id,g);cleanup();gid=null;state=null;cfg={};tab='home';room='all';rp=null;search='';postLimit=20;expanded.clear();render.room=null;render.tab=null;opening='';
 await openGroup(g,session);
}
async function openGroup(g,token){
 opening=g;
 try{
  const s=await db.doc('groups/'+g).get();if(token!==session)return;
  if(!s.exists||!s.data().activeIds.includes(me.id)){await dropGroup(g);return}
  gid=g;state=s.data();started=true;store.set('g:'+me.id,g);shell();subscribe();if(!me.onboarded)welcome();
 }catch(e){if(e.code==='permission-denied')await dropGroup(g);else fail(e)}
 finally{if(opening===g)opening=''}
}
async function dropGroup(g){
 toast(t('removedFromGroup'));
 try{await db.doc('users/'+me.id).update({gids:F.arrayRemove(g)})}catch(e){console.warn(e)}
}
function removedFromGroup(g){
 if(gid!==g)return;cleanup();gid=null;state=null;
 $('#app').innerHTML='<div class="auth">'+t('loading')+'</div>';dropGroup(g);
}
async function route(token){
 if(!me)return;const gids=Array.isArray(me.gids)?me.gids:null;
 if(!gids)return legacyFlow(token);
 if(gid&&started&&gids.includes(gid)){scheduleRender();return}
 if(gid&&!gids.includes(gid)){cleanup();gid=null;state=null}
 if(!gids.length){noGroupsUI();return}
 const saved=store.get('g:'+me.id),pick=gids.includes(saved)?saved:gids[0];
 if(opening===pick)return;
 await openGroup(pick,token);
}
// Accounts created before groups existed have no gids field: start them with an empty list.
async function legacyFlow(token){
 if(token!==session)return;
 await db.doc('users/'+me.id).update({gids:[]});
}
function noGroupsUI(){
 $('#app').innerHTML='<div class="auth"><h1>Krog</h1><p>'+t('noGroups')+'</p>'+field('gn','groupName','text','','maxlength="60"')+btn('createGroup',t('createGroup'),'','cta')+field('gc','codeLabel','text','','autocapitalize="characters" autocomplete="off"')+btn('joinGroup',t('joinBtn'),'','cta soc')+btn('lang','🌐 '+L.toUpperCase())+btn('logout',t('out'))+'</div>';
}
async function onAuth(u){
 session++;const token=session;selfUnsub?.();cleanup();me=null;authUser=u;state=null;cfg={};gid=null;opening='';tab='home';room='all';
 if(!u)return authUI();
 $('#app').innerHTML='<div class="auth">'+t('loading')+'</div>';
 selfUnsub=db.doc('users/'+u.uid).onSnapshot(d=>{
  if(token!==session)return;
  if(!d.exists){if(!joining)finishUI();return}
  me={...d.data(),id:u.uid};
  if(joining)return;
  route(token).catch(fail);
 },fail);
}
function shell(){
 $('#app').innerHTML='<header><i class="krog-logo" aria-hidden="true"></i>Krog<span style="flex:1"></span>'+btn('groups','<span id="groupName"></span><span aria-hidden="true">▾</span>','aria-label="'+t('groups')+'"','chip groupbtn')+btn('notifications',ICON.bell+'<span id="bellCount" class="badge" hidden></span>','aria-label="'+t('bell')+'"','iconbtn')+btn('install',ICON.install,'id="installBtn" hidden aria-label="'+t('inst')+'"','iconbtn')+'</header><div class="status" id="status" role="status"></div><main id="main"></main><div id="cb"></div><nav>'+[['home',NI.home],['ev',NI.ev],['chat',NI.chat],['gal',NI.gal],['me',NI.me]].map(([k,e])=>btn('tab','<b>'+e+'</b>'+t(k)+'<i id="badge_'+k+'" hidden></i>','data-k="'+k+'"','')).join('')+'</nav>'+btn('new','＋','aria-label="'+t('post')+'" id="fab"','fab');render();
}
function stream(query,assign){unsubs.push(query.onSnapshot(s=>{assign(s);scheduleRender()},quiet))}
function docs(s){return s.docs.map(d=>({...d.data(),id:d.id}))}

function balances(data){
 const bal={};for(const e of data){const ids=e.members,base=Math.floor(e.cents/ids.length),rem=e.cents%ids.length;bal[e.payer]=(bal[e.payer]||0)+e.cents;ids.forEach((uid,i)=>bal[uid]=(bal[uid]||0)-base-(i<rem?1:0))}
 const debt=Object.entries(bal).filter(([,v])=>v<0).map(([id,v])=>({id,n:-v})),credit=Object.entries(bal).filter(([,v])=>v>0).map(([id,n])=>({id,n})),result=[];let i=0,j=0;
 while(i<debt.length&&j<credit.length){const n=Math.min(debt[i].n,credit[j].n);result.push({from:debt[i].id,to:credit[j].id,cents:n});debt[i].n-=n;credit[j].n-=n;if(!debt[i].n)i++;if(!credit[j].n)j++}return result;
}

const SUBS={posts:['results','ballots'],lists:['items'],rooms:['msgs'],daily:['answers']};let wipeSkipped=0;
async function wipeCol(path,prog){
 for(;;){
  const s=await raw.collection(path).limit(200).get();if(s.empty)return;
  try{
   for(const d of s.docs)for(const sub of SUBS[path.split('/').pop()]||[])await wipeCol(d.ref.path+'/'+sub,prog).catch(e=>{if(!['ballots','results'].includes(sub))throw e;wipeSkipped++});
   const b=raw.batch();s.docs.forEach(d=>b.delete(d.ref));await b.commit();
  }catch(e){e.step=e.step||path.split('/').slice(2).join('/');throw e}
  prog?.(path);
 }
}

document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const fn=A[el.dataset.a];if(!fn)return;const lock=el.dataset.a+':'+(el.dataset.id||'');if(pendingActions.has(lock))return;pendingActions.add(lock);
 el.disabled=true;el.setAttribute('aria-busy','true');const timer=setTimeout(()=>{if(el.isConnected)toast(t('sync'))},10000);
 try{await fn(el,el.dataset.id,e)}catch(err){fail(err)}finally{clearTimeout(timer);pendingActions.delete(lock);el.disabled=false;el.removeAttribute('aria-busy')}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeSheet();tourEnd()}
 if(e.key==='Tab'&&$('.sheet')){const nodes=[...$('.sheet').querySelectorAll('button,input,textarea,select,[tabindex]')].filter(n=>!n.disabled&&n.offsetParent!==null),a=nodes[0],z=nodes.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z?.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a?.focus()}}
 if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
 const id=e.target.id;if(['listItem','listTitle','expenseAmount'].includes(id)){e.preventDefault();const action={listItem:'addItem',listTitle:'createList',expenseAmount:'saveExpense'}[id];$('.sheet [data-a="'+action+'"]')?.click();return}if(id==='search'){e.preventDefault();A.search()}else if(id==='chatText'){e.preventDefault();$('#cb [data-a="sendMessage"]').click()}else if(id==='gn'){e.preventDefault();document.querySelector('[data-a=createGroup]')?.click()}else if(id==='gc'){e.preventDefault();document.querySelector('[data-a=joinGroup]')?.click()}else if(['ae','ap','ac'].includes(id)){e.preventDefault();document.querySelector('[data-a=login],[data-a=signup],[data-a=finish]')?.click()}else if(id?.startsWith('comment_')){e.preventDefault();e.target.parentElement.querySelector('button').click()}
});

 if(!el.files?.length)return;el.disabled=true;const photoSave={avatarPhoto:'saveProfile',postPhotos:'publish',storyPhoto:'publishStory'}[el.id];if(photoSave){const save=$('.sheet [data-a="'+photoSave+'"]');if(save){save.disabled=true;save.setAttribute('aria-busy','true')}}
 if(el.id==='postPhotos'){const files=[...el.files];if(files.length+draftImages.length>3)throw Error('KROG:big');const im=await Promise.all(files.map(f=>shrink(f)));limitDoc([...draftImages,...im],700000);draftImages.push(...im);previewImages()}
 if(el.id==='avatarPhoto'){profileImage=await shrink(el.files[0],256);limitDoc(profileImage,85000);$('#avatarPreview').innerHTML=image(profileImage)}
 if(el.id==='storyPhoto'){draftImages=[await shrink(el.files[0])];$('#storyPreview').innerHTML=image(draftImages[0])}
 if(el.id==='chatPhoto')await sendMessage(await shrink(el.files[0]));
 el.value='';
 }catch(err){fail(err)}finally{el.disabled=false;const action={avatarPhoto:'saveProfile',postPhotos:'publish',storyPhoto:'publishStory'}[el.id];if(el.id==='postPhotos'&&el.isConnected)el.disabled=draftImages.length>=3;if(action&&el.isConnected){const save=$('.sheet [data-a="'+action+'"]');if(save){save.disabled=action==='publish'&&!!$('#galleryComposer')&&!draftImages.length;save.removeAttribute('aria-busy')}}}
});
