<style>
:root{--bg:#eef0ea;--card:#fff;--tx:#17232b;--mu:#6b7780;--ac:#2f5bff;--y:#ffd84d;--bd:#dfe3da;--in:#e8ebe3}
[data-t=dark]{--bg:#0e1116;--card:#171b22;--tx:#eaedf2;--mu:#8a94a1;--ac:#6f8bff;--bd:#252b35;--in:#222833}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.45 "Avenir Next","Segoe UI Variable",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top)}
button,input,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:auto}
header{display:flex;align-items:center;gap:8px;padding:12px 18px 6px;font-weight:800;font-size:24px;letter-spacing:-.5px}
header i{width:20px;height:20px;border:4px solid var(--ac);border-radius:50%;position:relative}
header i:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--y);right:-6px;top:-5px}
main{flex:1;overflow-y:auto;padding:4px 14px 90px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 0 6px;color:var(--mu);font-size:11px;position:relative;cursor:pointer}
nav button b{display:block;font-size:21px;font-weight:400}
nav button.on{color:var(--ac);font-weight:700}
nav i{position:absolute;top:3px;left:55%;background:var(--y);color:#17232b;font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:0 6px}
.card{background:var(--card);border-radius:22px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.mu{color:var(--mu);font-size:12.5px}
.ph{width:100%;border-radius:14px;margin-top:10px;display:block}
.act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.act button,.chip{background:var(--in);border:0;border-radius:20px;padding:7px 13px;cursor:pointer;font-size:13px}
.act button.on{background:var(--y);color:#17232b;font-weight:600}
.chip.on{background:var(--ac);color:#fff}
.bar{position:relative;background:var(--in);border-radius:12px;margin-top:6px;overflow:hidden;cursor:pointer;padding:9px 12px}
.bar u{position:absolute;inset:0 auto 0 0;background:var(--y);opacity:.55}
.bar p{position:relative;display:flex;justify-content:space-between}
.cm{margin-top:8px;font-size:14px}
input,textarea{width:100%;background:var(--in);border:0;border-radius:14px;padding:12px 14px;outline:0}
input:focus,textarea:focus{box-shadow:0 0 0 2px var(--ac)}
.cta{background:var(--ac);color:#fff;border:0;border-radius:16px;padding:13px;font-weight:700;width:100%;cursor:pointer}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;font-size:28px;border:0;color:#17232b;background:var(--y);box-shadow:0 6px 18px #0003;cursor:pointer}
.sheet{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:16px;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;flex-direction:column;max-width:80%;margin:5px 0}.msg.me{align-self:flex-end;align-items:flex-end;margin-left:auto}
.msg p{background:var(--card);padding:8px 13px;border-radius:18px;word-break:break-word}
.me p{background:var(--ac);color:#fff}
#cb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
#toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#17232be6;color:#fff;padding:9px 18px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
.auth{padding:48px 24px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px;margin:0 auto}
.cta.soc{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.auth h1{font-size:42px;letter-spacing:-1px}
.card{border:1px solid var(--bd)}
.card.what{display:flex;align-items:center;gap:12px;cursor:pointer}
.what span{flex:1;background:var(--in);border-radius:22px;padding:11px 16px;color:var(--mu)}
.what b{font-size:20px;font-weight:400}
.empty{text-align:center;margin-top:70px;color:var(--mu)}.empty b{display:block;font-size:46px;font-weight:400;margin-bottom:6px}
nav button b{width:fit-content;margin:0 auto 2px;padding:3px 18px;border-radius:14px;transition:background .2s}
nav button.on b{background:color-mix(in srgb,var(--ac) 16%,transparent)}
button,.bar{transition:transform .1s,background .2s}
button:active,.bar:active{transform:scale(.96)}
.sheet{animation:fd .2s}.sheet>div{animation:up .25s ease-out}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.msg p{border:1px solid var(--bd)}.me p{border-color:transparent}
.msg:not(.me) p{border-bottom-left-radius:6px}.msg.me p{border-bottom-right-radius:6px}
#ci{border-radius:22px}
header{padding-top:16px;font-size:26px}

/* Mobile viewport, keyboard and accessible controls */
html,body{overflow:hidden;overscroll-behavior:none;height:100%;padding:0}
#app{height:100vh;height:var(--vh,100dvh);padding-top:env(safe-area-inset-top);position:relative;min-height:0}
main{min-height:0;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;overflow-anchor:auto;padding-bottom:85px}
header{flex:none;padding:10px 14px;font-size:24px}nav,#cb{flex:none}
input,textarea,select{font-size:16px}button{min-height:42px}button:disabled{opacity:.5;cursor:wait}
select{background:var(--in);color:var(--tx);border:0;border-radius:12px;padding:10px;width:100%}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mu)}
.auth{overflow:auto}.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.sheet{height:var(--vh,100dvh);bottom:auto}.sheet>div{padding-bottom:calc(16px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet h2{font-size:20px}.sheet .close{align-self:flex-end}.fab{position:absolute;bottom:calc(80px + env(safe-area-inset-bottom));right:16px}
.notice{background:var(--y);color:#17232b;border-radius:16px;padding:12px;margin:10px 0}
.line{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}
.strip{display:flex;gap:8px;overflow:auto;padding:6px 0}.strip>*{flex:none}.story{border:2px solid var(--ac);border-radius:18px;background:var(--card);padding:8px;width:104px;text-align:left;font-size:12px}
.story img{width:100%;height:70px;object-fit:cover;border-radius:10px}.story span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid .ph{margin:0;height:160px;object-fit:cover}
.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:5px}.checks input{width:auto}
.listitem{display:flex;align-items:center;gap:8px;margin-top:10px}.listitem input[type=checkbox]{width:24px;height:24px}.listitem .done{text-decoration:line-through;color:var(--mu)}
.listitem select{width:120px;font-size:14px}.listitem span{flex:1;overflow-wrap:anywhere}
.badge{background:var(--y);color:#17232b;border-radius:10px;padding:1px 5px;font-size:11px}
.status{font-size:12px;padding:3px 14px;color:var(--mu)}.newdot{border-left:4px solid var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px}.card .chip{white-space:normal}
.bar{display:block;width:100%;text-align:left;border:0}.gal button{padding:0;border:0;background:transparent}.gal img{height:100%}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

nav button{min-width:0}nav button b{padding:3px 12px;max-width:100%}.row>input{min-width:0;flex:1}#cb input{min-width:0}

/* header icons, group switcher, story add button */
.iconbtn{position:relative;width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px;display:block}
.iconbtn .badge{position:absolute;top:-5px;right:-5px}
.groupbtn{min-width:0;max-width:46vw;flex:0 1 auto;font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap}
.groupbtn #groupName{overflow:hidden;text-overflow:ellipsis;min-width:0}
.story.addstory{display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;width:auto;height:auto;min-height:42px;align-self:center;padding:8px 16px;border-radius:22px;font-size:14px;font-weight:600;color:var(--ac)}

async function copyLegacy(src,dst,each){

  const s=await q.limit(50).get();

  await flush();if(s.size<50)break;cursor=s.docs.at(-1);
 }
}

 if(birthday){const [m,d]=p.birthday.split('-').map(Number);date=new Date(new Date().getFullYear(),m-1,d,9);if(date<new Date())date.setFullYear(date.getFullYear()+1);title='🎂 '+p.name;extra='RRULE:FREQ=YEARLY\r\n'}else{date=new Date(p.date);title=p.title}
 const fmt=d=>d.toISOString().replace(/[-:]|\.\d+/g,'');
 const lines='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Krog//SL\r\nBEGIN:VEVENT\r\nUID:'+id+(birthday?'-birthday':'')+'@krog\r\nDTSTAMP:'+fmt(new Date())+'\r\nDTSTART:'+fmt(date)+'\r\nDTEND:'+fmt(new Date(+date+3600000))+'\r\n'+extra+'SUMMARY:'+escapeICS(title)+'\r\nBEGIN:VALARM\r\nTRIGGER:-PT1H\r\nACTION:DISPLAY\r\nDESCRIPTION:'+escapeICS(title)+'\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n';download('krog.ics',lines,'text/calendar;charset=utf-8');
}
async function sendMessage(img=''){
 checkOnline();const input=$('#chatText'),text=input?.value.trim()||'',sentRoom=room,sentReply=rp;if(!text&&!img)return;const d={uid:me.id,name:me.name,text,ts:ts()};if(img)d.img=img;if(rp)d.rp=rp.text?.slice(0,500)||'📷';limitDoc(d);await db.collection('rooms/'+sentRoom+'/msgs').add(d);if(chatDrafts[sentRoom]?.trim()===text)delete chatDrafts[sentRoom];if(room===sentRoom&&input?.isConnected&&input.value.trim()===text)input.value='';if(rp===sentReply)rp=null;render();
}

async function exportArchive(){
 toast(t('archiveBusy'));const data={version:2,exportedAt:new Date().toISOString()};
 async function all(q){let result=[],cursor=null;for(;;){const s=await(cursor?q.orderBy(firebase.firestore.FieldPath.documentId()).startAfter(cursor).limit(100):q.orderBy(firebase.firestore.FieldPath.documentId()).limit(100)).get();result.push(...docs(s));if(s.size<100)break;cursor=s.docs.at(-1)}return result}
 data.users=await all(db.collection('groups/'+gid+'/members'));data.group={id:gid,name:state.name};for(const c of ['posts','expenses','lists'])data[c]=await all(db.collection(c));
 data.groupMessages=await all(db.collection('rooms/all/msgs'));data.listItems={};for(const l of data.lists)data.listItems[l.id]=await all(db.collection('lists/'+l.id+'/items'));
 data.anonymousResults={};for(const p of data.posts.filter(x=>x.type==='anon'))data.anonymousResults[p.id]=await all(db.collection('posts/'+p.id+'/results'));
 // Invitation secrets never belong in a shareable archive.
 data.users=data.users.map(({code,...u})=>u);download('krog-'+dayKey()+'.json',JSON.stringify(data,null,2),'application/json');
}

document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const fn=A[el.dataset.a];if(!fn)return;const lock=el.dataset.a+':'+(el.dataset.id||'');if(pendingActions.has(lock))return;pendingActions.add(lock);
 el.disabled=true;const timer=setTimeout(()=>{if(el.isConnected)toast(t('sync'))},10000);
 try{await fn(el,el.dataset.id,e)}catch(err){fail(err)}finally{clearTimeout(timer);pendingActions.delete(lock);el.disabled=false}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeSheet();
 if(e.key==='Tab'&&$('.sheet')){const nodes=[...$('.sheet').querySelectorAll('button,input,textarea,select,[tabindex]')].filter(n=>!n.disabled&&n.offsetParent!==null),a=nodes[0],z=nodes.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z?.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a?.focus()}}
 if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
 const id=e.target.id;if(id==='search'){e.preventDefault();A.search()}else if(id==='chatText'){e.preventDefault();$('#cb [data-a="sendMessage"]').click()}else if(id==='gn'){e.preventDefault();document.querySelector('[data-a=createGroup]')?.click()}else if(id==='gc'){e.preventDefault();document.querySelector('[data-a=joinGroup]')?.click()}else if(['ae','ap','ac'].includes(id)){e.preventDefault();document.querySelector('[data-a=login],[data-a=signup],[data-a=finish]')?.click()}else if(id?.startsWith('comment_')){e.preventDefault();e.target.parentElement.querySelector('button').click()}
});

 }catch(err){fail(err)}finally{el.disabled=false}
});
