.cta.soc{background:var(--card);color:var(--tx);border:1px solid var(--bd)}

function sheet(h){$('.sheet')?.remove();const d=document.createElement('div');d.className='sheet';d.dataset.a='x';d.innerHTML='<div>'+h+'</div>';document.body.appendChild(d)}
function composer(){const ty=cm.type;sheet(`<div class=row style="gap:6px">${['post','poll','event','when'].map(k=>`<button class="chip ${k==ty?'on':''}" data-a=ct data-k=${k}>${t(k)}</button>`).join('')}</div>
${ty=='event'?`<input id=evt placeholder="${t('evt')}"><input id=evd type=datetime-local>`:''}
${ty=='when'?`<input id=evt placeholder="${t('evt')}">${[1,2,3,4].map(()=>'<input class=wd type=datetime-local>').join('')}`:''}${ty=='poll'?`<input id=pq placeholder="${t('q')}">${[1,2,3,4].map(i=>`<input class=po placeholder="${t('opt')} ${i}">`).join('')}`:''}

ct:el=>{cm.text=$('#tx').value;cm.type=el.dataset.k;composer()},
pub:async()=>{const ty=cm.type,text=$('#tx').value.trim(),d={uid:me.id,name:me.name,type:ty,text,ts:Date.now(),likes:[],comments:[]};if(cm.img)d.img=cm.img;

if(ty=='post'&&!text&&!cm.img)return;await db.collection('posts').add(d);$('.sheet').remove();cm={type:'post',img:null}},
like:(el,id)=>P(id).update({likes:(posts.find(x=>x.id==id).likes||[]).includes(me.id)?F.arrayRemove(me.id):F.arrayUnion(me.id)}),
vote:(el,id)=>P(id).update({['votes.'+me.id]:+el.dataset.i}),

cs:(el,id)=>{const i=$('#ci_'+id),v=i.value.trim();if(v){i.value='';return P(id).update({comments:F.arrayUnion({uid:me.id,name:me.name,text:v,ts:Date.now()})})}},

mo:(el,id)=>{sel=sel==id?null:id;render()},

free:(el,id)=>{const i=+el.dataset.i,v=(posts.find(x=>x.id==id).votes||{})[me.id]||[];return P(id).update({['votes.'+me.id]:v.includes(i)?v.filter(x=>x!=i):[...v,i]})},
ics:(el,id)=>{const p=posts.find(x=>x.id==id),d=new Date(p.date),f=x=>x.toISOString().replace(/[-:]|\.\d+/g,''),s='BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nUID:'+id+'\nDTSTAMP:'+f(new Date)+'\nDTSTART:'+f(d)+'\nDTEND:'+f(new Date(+d+72e5))+'\nSUMMARY:'+p.title+'\nEND:VEVENT\nEND:VCALENDAR',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/calendar'}));a.download='krog.ics';a.click()},
zoom:(el,id)=>sheet(`<img class=ph src="${posts.find(p=>p.id==id).img}" style="margin:0"><button class=chip data-a=x>✕</button>`),
x:(el,id,e)=>{if(e.target==el||el.tagName=='BUTTON')$('.sheet')?.remove()},
nc:()=>db.doc('config/app').update({code:rnd()}),cpc:()=>{navigator.clipboard?.writeText(cfg.code);toast(t('cp'))},

rj:(el,id)=>db.doc('users/'+id).update({status:'rejected'})};
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;try{await A[el.dataset.a]?.(el,el.dataset.id,e)}catch(x){toast(x.message)}});
